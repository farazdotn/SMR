{% if url %}
<div class="player">
  <audio preload="none" src="{{ url }}"></audio>
  <button type="button" class="play" aria-label="Play preview">
    <svg class="i-play" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
    <svg class="i-pause" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg>
  </button>
  <div class="track"><div class="bar"><div class="fill"></div></div></div>
  <span class="time">0:30</span>
</div>
{% endif %}
