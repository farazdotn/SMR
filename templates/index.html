<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crate Digger</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; max-width: 640px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { margin-bottom: .25rem; }
    .tagline { color: #999; margin-top: 0; }
    form { display: flex; gap: .5rem; margin: 1.5rem 0; }
    input[type=text] { flex: 1; padding: .7rem; border-radius: 8px; border: 1px solid #333; background: #1c1c1c; color: inherit; font-size: 1rem; }
    button { padding: .7rem 1.2rem; border: 0; border-radius: 8px; background: #e8b84a; color: #111; font-weight: 600; cursor: pointer; }
    .htmx-indicator { display: none; color: #e8b84a; margin-bottom: 1rem; }
    .htmx-request.htmx-indicator { display: flex; align-items: center; gap: .6rem; animation: fade-in .3s ease both; }
    .spinner { width: 20px; height: 20px; border: 3px solid #333; border-top-color: #e8b84a; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { color: #999; }
    .error { color: #ff8a80; }
    .searched { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; }
    .searched img { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
    .searched p { margin: 0 0 .4rem; }    .card { display: flex; gap: 1rem; padding: 1rem; margin-bottom: .75rem; background: #1c1c1c; border-radius: 12px; }
    .card img { width: 96px; height: 96px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
    .card h3 { margin: 0; }
    .artist { margin: 0 0 .5rem; color: #999; }
    .rationale { font-style: italic; margin: 0 0 .6rem; }
    .links a { color: #e8b84a; margin-right: .8rem; font-size: .9rem; }
    .wrong { margin: 0 0 1rem; }
    .wrong summary { cursor: pointer; color: #e8b84a; font-size: .9rem; }
    .wrong ul { list-style: none; padding: 0; margin: .5rem 0 0; }
    .wrong a { display: flex; gap: .75rem; align-items: center; padding: .5rem; border-radius: 8px; color: inherit; text-decoration: none; }
    .wrong a:hover { background: #1c1c1c; }
    .wrong img { width: 40px; height: 40px; border-radius: 4px; }
    @keyframes fade-in { from { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
    .searched, .error { animation: fade-in .4s ease both; }
    .card { animation: rise .5s ease both; animation-delay: calc(var(--i, 0) * 120ms); }
    @media (prefers-reduced-motion: reduce) {
      .card, .searched, .error, .htmx-request.htmx-indicator { animation: none; }
    }
    .player { display: flex; align-items: center; gap: .6rem; max-width: 320px; margin: 0 0 .6rem; }
    .player .play { width: 32px; height: 32px; padding: 0; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; transition: transform .15s ease; }
    .player .play:hover { transform: scale(1.08); }
    .player .play:focus-visible { outline: 2px solid #eee; outline-offset: 2px; }
    .player .i-pause, .player.playing .i-play { display: none; }
    .player.playing .i-pause { display: block; }
    .player .track { flex: 1; padding: 6px 0; cursor: pointer; }
    .player .bar { height: 6px; border-radius: 3px; background: #333; overflow: hidden; }
    .player .fill { height: 100%; width: 0; background: #e8b84a; transition: width .25s linear; }
    .player .time { min-width: 2.4em; text-align: right; font-size: .8rem; color: #999; font-variant-numeric: tabular-nums; }
    .player.broken { opacity: .45; pointer-events: none; }
  </style>
</head>
<body>
  <h1>Crate Digger</h1>
  <p class="tagline">Tell us a song. We'll tell you what you should've been listening to.</p>

  <form hx-get="{% url 'search' %}" hx-target="#results" hx-indicator="#spinner" hx-push-url="true">
    <input type="text" name="q" value="{{ q }}" placeholder="Song and artist, e.g. Reckoner Radiohead" required autofocus>
    <button type="submit">Judge me</button>
  </form>

    <div id="spinner" class="htmx-indicator">
    <span class="spinner"></span>
    <span>Consulting the crate-diggers…</span>
  </div>

  <main id="results">
    {% include "_results.html" %}
  </main>
<script>
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

  function render(audio) {
    const player = audio.closest(".player");
    if (!player) return;
    const duration = audio.duration || 30;
    player.classList.toggle("playing", !audio.paused);
    player.querySelector(".play").setAttribute("aria-label", audio.paused ? "Play preview" : "Pause preview");
    player.querySelector(".fill").style.width = `${(audio.currentTime / duration) * 100}%`;
    player.querySelector(".time").textContent = fmt(audio.currentTime > 0 ? audio.currentTime : duration);
  }

  // Media events don't bubble, so we listen in the capture phase on document.
  // That keeps working after HTMX swaps in new results.
  ["play", "pause", "timeupdate", "loadedmetadata"].forEach((type) =>
    document.addEventListener(type, (e) => e.target instanceof HTMLAudioElement && render(e.target), true)
  );

  // Only one clip at a time. Pausing the others fires their "pause" event,
  // which flips their buttons back to ▶ automatically.
  document.addEventListener("play", (e) => {
    document.querySelectorAll("audio").forEach((a) => { if (a !== e.target) a.pause(); });
  }, true);

  document.addEventListener("ended", (e) => {
    if (e.target instanceof HTMLAudioElement) { e.target.currentTime = 0; render(e.target); }
  }, true);

  // Expired or dead preview URLs: grey the player out instead of leaving a dead button.
  document.addEventListener("error", (e) => {
    if (!(e.target instanceof HTMLAudioElement)) return;
    const player = e.target.closest(".player");
    if (player) { player.classList.add("broken"); player.querySelector(".time").textContent = "n/a"; }
  }, true);

  document.addEventListener("click", (e) => {
    const player = e.target.closest(".player");
    if (!player) return;
    const audio = player.querySelector("audio");
    if (e.target.closest(".play")) {
      audio.paused ? audio.play().catch(() => {}) : audio.pause();
    } else if (e.target.closest(".track") && audio.duration) {
      const rect = player.querySelector(".track").getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    }
  });
</script>
</body>
</html>
